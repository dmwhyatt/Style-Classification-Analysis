name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Materialize Git LFS files
        run: git lfs pull

      - name: Verify melody assets for Pages
        run: |
          test -f docs/melody_player.html
          test -f docs/melody_examples/manifest.json
          f=$(find docs/melody_examples/midi -name '*.mid' | head -1)
          test -n "$f"
          head -c 4 "$f" | grep -q $'\x4d\x54\x68\x64' || \
            (echo "MIDI file looks like an LFS pointer, not binary: $f" && exit 1)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          # Default excludes dotfiles; keep docs/.nojekyll so Pages skips Jekyll.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
